<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&family=Hind+Siliguri:wght@400;600&display=swap">
<style>
/* Layout: KinBird Pro app shell. 248px quiet sidebar, 58px blurred topbar with centred search, 1360px content column.
   Every token below is copied from kinbird-pro-app globals.css; nothing new is invented. */
:root{
  --bg:hsl(240 7% 97%); --card:hsl(0 0% 100%); --surface:hsl(240 6% 95%); --fg:hsl(240 10% 9%); --muted:hsl(240 4% 40%);
  --bd:hsl(240 6% 90%); --bd2:hsl(240 5% 82%); --input:hsl(240 5% 56%); --track:hsl(240 10% 9% / .14);
  --p:hsl(158 69% 37%); --pfill:hsl(158 69% 30%); --phover:hsl(158 69% 26%); --pdark:hsl(158 60% 25%); --psoft:hsl(158 45% 92%); --pfg:#fff;
  --red:hsl(1 73% 44%); --redsoft:hsl(1 73% 95%);
  --amb:hsl(35 86% 54%); --ambsoft:hsl(38 82% 92%); --ambtx:hsl(30 84% 28%);
  --info:hsl(211 71% 48%); --infosoft:hsl(207 75% 94%); --infotx:hsl(211 83% 27%);
  --pink:hsl(337 51% 29%); --pinksoft:hsl(337 70% 95%);
  --pur:hsl(262 65% 58%); --pursoft:hsl(262 65% 94%); --purtx:hsl(262 55% 32%);
  --sb:hsl(240 8% 95.5%); --sbfg:hsl(240 10% 12%); --sbmuted:hsl(240 4% 42%); --sbbd:hsl(240 6% 89%); --sbhover:hsl(240 6% 90.5%); --sbon:hsl(0 0% 100%); --sbonfg:hsl(158 62% 22%);
  --sh1:0 1px 2px rgba(16,24,40,.05),0 0 0 1px rgba(16,24,40,.015);
  --sans:'DM Sans','Hind Siliguri',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:hsl(220 18% 5%); --card:hsl(220 16% 8%); --surface:hsl(220 14% 11%); --fg:hsl(0 0% 96%); --muted:hsl(220 8% 64%);
  --bd:hsl(220 14% 16%); --bd2:hsl(220 14% 22%); --input:hsl(220 9% 42%); --track:hsl(0 0% 96% / .14);
  --p:hsl(158 60% 50%); --pfill:hsl(158 60% 50%); --phover:hsl(158 60% 44%); --pdark:hsl(158 60% 62%); --psoft:hsl(158 40% 14%); --pfg:hsl(220 18% 5%);
  --red:hsl(0 72% 65%); --redsoft:hsl(0 50% 18%); --amb:hsl(35 86% 60%); --ambsoft:hsl(38 50% 16%); --ambtx:hsl(38 80% 72%);
  --info:hsl(211 71% 60%); --infosoft:hsl(211 50% 16%); --infotx:hsl(211 80% 76%); --pink:hsl(337 70% 80%); --pinksoft:hsl(337 40% 16%);
  --pur:hsl(262 75% 70%); --pursoft:hsl(262 40% 18%); --purtx:hsl(262 80% 80%);
  --sb:hsl(220 16% 7%); --sbfg:hsl(0 0% 94%); --sbmuted:hsl(220 8% 60%); --sbbd:hsl(220 14% 14%); --sbhover:hsl(220 14% 12%); --sbon:hsl(158 40% 14%); --sbonfg:hsl(158 60% 62%);
  --sh1:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:hsl(220 18% 5%); --card:hsl(220 16% 8%); --surface:hsl(220 14% 11%); --fg:hsl(0 0% 96%); --muted:hsl(220 8% 64%);
  --bd:hsl(220 14% 16%); --bd2:hsl(220 14% 22%); --input:hsl(220 9% 42%); --track:hsl(0 0% 96% / .14);
  --p:hsl(158 60% 50%); --pfill:hsl(158 60% 50%); --phover:hsl(158 60% 44%); --pdark:hsl(158 60% 62%); --psoft:hsl(158 40% 14%); --pfg:hsl(220 18% 5%);
  --red:hsl(0 72% 65%); --redsoft:hsl(0 50% 18%); --amb:hsl(35 86% 60%); --ambsoft:hsl(38 50% 16%); --ambtx:hsl(38 80% 72%);
  --info:hsl(211 71% 60%); --infosoft:hsl(211 50% 16%); --infotx:hsl(211 80% 76%); --pink:hsl(337 70% 80%); --pinksoft:hsl(337 40% 16%);
  --pur:hsl(262 75% 70%); --pursoft:hsl(262 40% 18%); --purtx:hsl(262 80% 80%);
  --sb:hsl(220 16% 7%); --sbfg:hsl(0 0% 94%); --sbmuted:hsl(220 8% 60%); --sbbd:hsl(220 14% 14%); --sbhover:hsl(220 14% 12%); --sbon:hsl(158 40% 14%); --sbonfg:hsl(158 60% 62%);
  --sh1:none; color-scheme:dark}

*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit;text-decoration:none} button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
input,select{font:inherit;color:inherit;letter-spacing:inherit}
b,strong{font-weight:650} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.good{color:var(--pdark)} .bad{color:var(--red)} .warn{color:var(--ambtx)} .mt{color:var(--muted)}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}

/* shell */
.app{display:flex;min-height:100%}
.sb{display:none;width:248px;flex-shrink:0;flex-direction:column;background:var(--sb);color:var(--sbfg);border-right:1px solid var(--sbbd);position:sticky;top:0;height:100vh;padding:12px 10px;overflow:hidden}
.sb-brand{display:flex;align-items:center;gap:10px;padding:6px 6px 12px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--pfill);color:var(--pfg);display:grid;place-items:center;flex-shrink:0}
.sb-brand b{display:block;font-size:15px;letter-spacing:-.02em;line-height:1.2} .sb-brand small{display:block;font-size:11.5px;color:var(--sbmuted)}
.sb-rail{margin-left:auto;width:28px;height:28px;border-radius:7px;color:var(--sbmuted);display:grid;place-items:center} .sb-rail:hover{background:var(--sbhover);color:var(--sbfg)}
.sb nav{flex:1;overflow-y:auto}
.sb h6{margin:0;padding:16px 10px 6px;font-size:12px;font-weight:600;color:var(--sbmuted)}
.ni{display:flex;align-items:center;gap:11px;min-height:40px;padding:0 10px;border-radius:10px;font-size:14px;color:color-mix(in oklab,var(--sbfg) 82%,transparent);width:100%;text-align:left}
.ni:hover{background:var(--sbhover);color:var(--sbfg)}
.ni.on{background:var(--sbon);color:var(--sbonfg);font-weight:600;box-shadow:var(--sh1)}
.ni svg{width:16px;height:16px;flex-shrink:0} .ni span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni .n{font-size:11.5px;color:var(--sbmuted);font-family:var(--mono)} .ni.on .n{color:var(--sbonfg)}
.ni .tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--psoft);color:var(--pdark)} .ni .tag.amb{background:var(--ambsoft);color:var(--ambtx)} .ni .tag.red{background:var(--redsoft);color:var(--red)}
.sb-foot{border-top:1px solid var(--sbbd);padding-top:10px;margin-top:6px}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px} .sb-user:hover{background:var(--sbhover)}
.av{width:30px;height:30px;border-radius:50%;background:var(--sbon);color:var(--sbonfg);font-size:12px;font-weight:700;display:grid;place-items:center;flex-shrink:0;box-shadow:var(--sh1)}
.sb-user b{display:block;font-size:13px} .sb-user small{display:block;font-size:11px;color:var(--sbmuted)}

main{flex:1;min-width:0;padding-bottom:76px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;min-height:58px;padding:8px 12px;border-bottom:1px solid var(--bd);background:color-mix(in oklab,var(--bg) 80%,transparent);backdrop-filter:blur(20px) saturate(1.5)}
.top .t{font-size:16px;font-weight:700;letter-spacing:-.025em;opacity:0;transform:translateY(4px);transition:.2s} .top.scrolled .t{opacity:1;transform:none}
.search{display:none;align-items:center;gap:8px;height:36px;width:min(380px,100%);padding:0 12px;border-radius:10px;background:var(--surface);color:var(--muted);font-size:13px;justify-self:center}
.search kbd{margin-left:auto;font:11px var(--mono);padding:1px 5px;border:1px solid var(--bd2);border-radius:5px;background:var(--card);color:var(--muted)}
.top-r{display:flex;align-items:center;gap:2px;justify-self:end}
.ib{width:44px;height:44px;border-radius:9px;display:grid;place-items:center;color:var(--muted)} .ib:hover{background:var(--surface);color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 14px;border-radius:10px;font-size:13.5px;font-weight:600;white-space:nowrap;transition:.15s}
.b-pri{background:var(--pfill);color:var(--pfg)} .b-pri:hover{background:var(--phover)}
.b-out{border:1px solid var(--bd);background:var(--card);box-shadow:var(--sh1)} .b-out:hover{background:var(--surface)}
.b-sm{height:32px;padding:0 10px;font-size:12.5px} .btn svg{width:15px;height:15px}
.top-add{display:none;margin-left:6px}

.wrap{max-width:1360px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px;padding-top:6px}
.ph .eb{font-size:12px;font-weight:600;color:var(--muted)}
.ph h1{margin:2px 0 0;font-size:28px;font-weight:700;letter-spacing:-.038em;line-height:1.08;text-wrap:balance}
.ph .ln{margin:6px 0 0;font-size:14.5px;color:var(--muted);max-width:760px} .ph .ln b{color:var(--fg)} .ph .ln b.bad{color:var(--red)}
.ph .acts{display:none;gap:8px;flex-shrink:0}

.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh1)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px 0}
.card-h h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em} .card-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.card-b{padding:14px 18px 16px}
.kpi{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh1);overflow:hidden}
.kpi>div{padding:10px 14px;min-width:0} .kpi>div:nth-child(odd){border-right:1px solid var(--bd)} .kpi>div:nth-child(-n+2){border-bottom:1px solid var(--bd)}
.kpi .l{display:block;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{display:block;font-size:19px;font-weight:700;letter-spacing:-.035em;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{display:none;font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g2{display:grid;gap:14px;grid-template-columns:1fr}
.big{font-size:30px;font-weight:700;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:999px;background:var(--track);overflow:hidden} .bar i{display:block;height:100%;border-radius:999px;background:var(--p)} .bar.amb i{background:var(--amb)} .bar.red i{background:var(--red)} .bar.info i{background:var(--info)} .bar.pur i{background:var(--pur)}
.rows{display:flex;flex-direction:column} .row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--bd)} .row:first-child{border-top:0}
.row .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;background:var(--surface);color:var(--muted)} .ic svg{width:15px;height:15px}
.ic.g{background:var(--psoft);color:var(--pdark)} .ic.a{background:var(--ambsoft);color:var(--ambtx)} .ic.r{background:var(--redsoft);color:var(--red)} .ic.i{background:var(--infosoft);color:var(--infotx)} .ic.p{background:var(--pursoft);color:var(--purtx)} .ic.k{background:var(--pinksoft);color:var(--pink)}
.row .tx{flex:1;min-width:0} .row .tx b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .row .tx small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.row .rt{text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums} .row .rt b{display:block;font-size:14px} .row .rt small{display:block;font-size:11.5px;color:var(--muted)}
.lnk{font-size:13px;font-weight:600;color:var(--pdark);white-space:nowrap} .lnk:after{content:" ›"}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--surface);color:var(--fg);white-space:nowrap}
.pill.g{background:var(--psoft);color:var(--pdark)} .pill.a{background:var(--ambsoft);color:var(--ambtx)} .pill.r{background:var(--redsoft);color:var(--red)} .pill.i{background:var(--infosoft);color:var(--infotx)} .pill.p{background:var(--pursoft);color:var(--purtx)} .pill.k{background:var(--pinksoft);color:var(--pink)}
.pill.dot:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}

.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--bd);margin:0 -2px} .tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 10px;font-size:13px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0} .tab svg{width:14px;height:14px}
.tab.on{color:var(--fg);font-weight:600;border-color:var(--pfill)} .tab:hover{color:var(--fg)}
.chips{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px} .chips::-webkit-scrollbar{display:none}
.chip{height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--bd);background:var(--card);font-size:12.5px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;flex-shrink:0}
.chip.on{background:var(--psoft);border-color:var(--psoft);color:var(--pdark);font-weight:600} .chip.ib{width:30px;padding:0;justify-content:center}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px} .tools .sp{flex:1}
.fsearch{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--muted);font-size:13px;min-width:0;width:100%} .fsearch svg{width:14px;height:14px}

.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:14px;background:var(--card);box-shadow:var(--sh1)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{height:38px;padding:0 12px;text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--bd);background:var(--card)}
td{padding:10px 12px;vertical-align:middle;border-bottom:1px solid color-mix(in oklab,var(--bd) 60%,transparent)} tr:last-child td{border-bottom:0} tbody tr:hover td{background:color-mix(in oklab,var(--surface) 70%,transparent)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px} td.num{font-weight:500}
td .it{display:flex;align-items:center;gap:9px;font-weight:600} td .it .ic{width:26px;height:26px;border-radius:7px} td .it .ic svg{width:13px;height:13px}
td .sub{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px}
tfoot td{font-weight:700;border-top:1px solid var(--bd);background:var(--card)}
.addrow{display:grid;grid-template-columns:1fr;gap:8px;padding:12px;border-top:1px solid var(--bd);background:color-mix(in oklab,var(--surface) 55%,var(--card))}
.fld{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--input);border-radius:10px;background:var(--card);font-size:13.5px;color:var(--muted);min-width:0} .fld svg{width:14px;height:14px;flex-shrink:0;color:var(--muted)}
.fld.v{color:var(--fg)} .fld .cr{margin-left:auto}
.addrow .ck{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)} .addrow .ck i{width:16px;height:16px;border:1.5px solid var(--input);border-radius:4px;display:inline-block}
.addrow .go{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.chart{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:18px} .chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;height:100%;justify-content:flex-end;min-width:0}
.chart .bars{display:flex;align-items:flex-end;gap:3px;width:100%;height:100%;justify-content:center} .chart .bars i{display:block;width:45%;max-width:22px;border-radius:4px 4px 0 0;background:var(--pfill);min-height:2px} .chart .bars i.e{background:var(--track)}
.chart .lbl{font-size:11px;color:var(--muted);margin-top:6px;white-space:nowrap} .chart .val{font:11px var(--mono);color:var(--muted);margin-bottom:4px}
.chart .c.hi .bars i:not(.e){background:var(--p)} .chart .c.hi .lbl{color:var(--fg);font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap} .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;font-size:13px;padding:7px 0} .hbar .bar{height:8px} .hbar .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;text-align:right;min-width:72px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:11.5px;font-weight:600;color:var(--muted);text-align:center;padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:10px;border:1px solid var(--bd);padding:6px;font-size:12.5px;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--card)}
.cal .d.o{opacity:.4} .cal .d.today{border-color:var(--pfill);box-shadow:inset 0 0 0 1px var(--pfill)} .cal .d .dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}
.cal .d .dots i{width:7px;height:7px;border-radius:50%;background:var(--amb)} .cal .d .dots i.g{background:var(--p)} .cal .d .dots i.r{background:var(--red)} .cal .d .dots i.b{background:var(--info)}
.cal .d .n{font-weight:600} .cal .d .ev{display:none;font-size:11px;padding:1px 5px;border-radius:5px;background:var(--ambsoft);color:var(--ambtx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .cal .d .ev.g{background:var(--psoft);color:var(--pdark)} .cal .d .ev.r{background:var(--redsoft);color:var(--red)} .cal .d .ev.b{background:var(--infosoft);color:var(--infotx)}

.acct{display:grid;grid-template-columns:1fr;gap:12px}
.ac{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.ac .h{display:flex;align-items:center;gap:10px} .ac .h b{font-size:14px} .ac .h small{display:block;font-size:12px;color:var(--muted)} .ac .amt{font-size:24px;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums} .ac .amt small{font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px;font-family:var(--sans)}
.goal{padding:16px 18px;display:flex;flex-direction:column;gap:8px} .goal .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px} .goal .h b{font-size:14.5px} .goal .h span{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;padding:36px 16px;color:var(--muted);font-size:13px} .empty b{display:block;color:var(--fg);font-size:14px;margin-bottom:3px}
.setl{display:flex;flex-direction:column} .setl .row{align-items:center} .sw{width:38px;height:22px;border-radius:999px;background:var(--pfill);position:relative;flex-shrink:0} .sw:after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff} .sw.off{background:var(--track)} .sw.off:after{right:auto;left:3px}
.notice{font-size:12px;color:var(--muted);padding:8px 12px;border:1px dashed var(--bd2);border-radius:10px;background:var(--surface)}

/* phone nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;border-top:1px solid var(--bd);background:color-mix(in oklab,var(--bg) 95%,transparent);backdrop-filter:blur(12px);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px));display:flex}

const pagesEl = document.getElementById("pages");
function go(k){
  if(!P[k]) k="dashboard";
  pagesEl.innerHTML = P[k]();
  document.getElementById("topTitle").textContent = TITLES[k];
  document.querySelector(".top-add").innerHTML = ico("plus",15) + ADD[k];
  document.querySelectorAll("[data-go]").forEach(b=>b.classList.toggle("on", b.dataset.go===k));
  window.scrollTo({top:0});
  document.title = "Cashflow v1 · " + TITLES[k];
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if(b){ location.hash = b.dataset.go; return; }
  const a = e.target.closest('a[href^="#"]'); if(a){ e.preventDefault(); location.hash = a.getAttribute("href").slice(1); }
});
window.addEventListener("hashchange", () => go(location.hash.slice(1)));
go(location.hash.slice(1) || "dashboard");

document.getElementById("themeBtn").onclick = toggleTheme; document.getElementById("themeBtn2").onclick = toggleTheme;
document.addEventListener("keydown", e => { if(e.key==="t" && !/input|textarea/i.test(e.target.tagName)) toggleTheme(); });
